<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desafio da Multiplicação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 10px;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px 20px;
      display: inline-block;
      border-radius: 16px;
      box-shadow: 0 0 20px #aaa;
      max-width: 95%;
    }

    h1 {
      color: #333366;
      font-size: 40px;
      margin-bottom: 35px;
    }

    .question {
      font-size: 38px;
      margin-bottom: 35px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 30px;
      margin-bottom: 35px;
    }

    .option {
      background-color: #eeeeff;
      border: 3px solid #bbb;
      border-radius: 18px;
      padding: 30px;
      font-size: 34px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      background-color: #d0d0ff;
    }

    #resultado {
      font-size: 30px;
      margin-top: 20px;
    }

    #pontos {
      font-size: 28px;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 36px;
      }
      .question {
        font-size: 34px;
      }
      .option {
        font-size: 30px;
        padding: 25px;
      }
      #resultado {
        font-size: 26px;
      }
      #pontos {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Desafio da Multiplicação</h1>
    <div class="question" id="pergunta">Quanto é 3 × 1?</div>
    <div class="options" id="opcoes"></div>
    <div id="resultado"></div>
    <p>Pontuação: <span id="pontos">0</span></p>
  </div>

  <script>
    let multiplicando, multiplicador;
    let pontos = 0;

    function novaPergunta() {
      const tabuadas = [3, 4];
      multiplicando = tabuadas[Math.floor(Math.random() * tabuadas.length)];
      multiplicador = Math.floor(Math.random() * 10) + 1;

      const correta = multiplicando * multiplicador;
      const opcoes = gerarOpcoes(correta);

      document.getElementById("pergunta").textContent = `Quanto é ${multiplicando} × ${multiplicador}?`;
      document.getElementById("opcoes").innerHTML = '';

      opcoes.forEach(valor => {
        const botao = document.createElement("button");
        botao.className = "option";
        botao.textContent = valor;
        botao.onclick = () => verificarResposta(valor);
        document.getElementById("opcoes").appendChild(botao);
      });

      document.getElementById("resultado").textContent = '';
    }

    function gerarOpcoes(correta) {
      const opcoes = new Set();
      opcoes.add(correta);
      while (opcoes.size < 3) {
        const fake = correta + Math.floor(Math.random() * 11 - 5);
        if (fake > 0 && fake !== correta) opcoes.add(fake);
      }
      return Array.from(opcoes).sort(() => Math.random() - 0.5);
    }

    function verificarResposta(resposta) {
      const correta = multiplicando * multiplicador;
      const resultado = document.getElementById("resultado");

      if (resposta === correta) {
        pontos++;
        resultado.textContent = "✅ Acertou!";
        resultado.style.color = "green";
      } else {
        resultado.textContent = `❌ Errou! A resposta correta é ${correta}`;
        resultado.style.color = "red";
      }

      document.getElementById("pontos").textContent = pontos;
      setTimeout(novaPergunta, 1500);
    }

    novaPergunta();
  </script>

</body>
</html>
